name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s controller/tests -p 'test_*.py'
      - run: python -m py_compile controller/*.py scripts/analyze.py

  runner-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test public benchmark harness
        run: mvn -B --no-transfer-progress -f runner/pom.xml clean test package
      - name: Verify shaded runner starts
        run: java -jar runner/target/benchmark-runner.jar --describe

# The real MF adapter is deliberately built in Docker/DPM with -Pframework.
# GitHub's repository-scoped GITHUB_TOKEN for this public repository cannot
# read packages attached to the private multiplayer-framework repository.
# The server build uses the existing Maven settings secret with package access.
